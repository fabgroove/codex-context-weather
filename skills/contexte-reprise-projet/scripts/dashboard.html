<!doctype html>
<html lang="fr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Weather · Codex</title>
<style>
:root{font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:#333c3d;background:#fafaf8;--tone:#518865;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:48px 28px}main{max-width:720px;margin:auto}button{font:inherit;color:inherit;cursor:pointer}.row{display:flex;align-items:center;gap:12px;min-height:32px}.dot{width:6px;height:6px;background:var(--tone);border-radius:50%;flex:none}h1{font-size:14px;font-weight:550;margin:0;white-space:nowrap}#percent{font-variant-numeric:tabular-nums;font-weight:600;color:var(--tone)}.meter{flex:1;max-width:170px;height:2px;background:#e4e8e4;position:relative}.fill{height:100%;width:0;background:var(--tone);transition:width .5s}#mark{position:absolute;top:-3px;width:1px;height:8px;background:#929d96;left:60%}#tokens{font-size:12px;color:#77817b;white-space:nowrap}.lang{display:flex;margin-left:auto;gap:6px}.lang button{border:0;padding:2px 3px;background:none;color:#89918b;font-size:11px}.lang button[aria-pressed=true]{color:#333c3d;text-decoration:underline;text-underline-offset:4px}.secondary{font-size:12px;color:#768078;gap:7px}.secondary button{font-size:12px;background:none;border:0;border-bottom:1px solid #cdd3ce;padding:0;margin-left:auto;white-space:nowrap}#hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#notice{font-size:12px;color:var(--tone);min-height:26px;padding-left:18px;padding-top:3px}.secondary button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid #577b9b;outline-offset:4px}#freshness{font-size:11px;color:#9aa19b;margin:16px 0 0 18px;max-width:620px;line-height:1.5}footer{border-top:1px solid #e9ece7;margin-top:19px;padding-top:10px;font-size:11px;color:#a1a69f;display:none}#details[open] footer{display:block}summary{list-style:none;cursor:pointer;font-size:11px;color:#90988f;margin:12px 0 0 18px;width:max-content}summary::-webkit-details-marker{display:none}summary:focus-visible{outline:2px solid #577b9b}@media(max-width:540px){body{padding:28px 18px}.row{gap:8px}.meter{max-width:70px}#tokens{display:none}.secondary{flex-wrap:wrap}.secondary button{margin-left:18px}.lang{gap:2px}#notice{padding-left:14px}#freshness{margin-left:14px}}
</style>
<main>
<div class="row"><span class="dot" aria-hidden="true"></span><h1 id="title">Contexte</h1><span id="percent">—</span><div class="meter" role="meter" id="meter" aria-label="Contexte utilisé" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill"></div><span id="mark" aria-hidden="true"></span></div><span id="tokens">—</span><nav class="lang" aria-label="Language"><button id="fr" lang="fr" aria-pressed="true">FR</button><button id="en" lang="en" aria-pressed="false">EN</button></nav></div>
<div class="row secondary"><span id="threshold">—</span><span aria-hidden="true">·</span><span id="hint">Lecture du compteur…</span><button id="copy" disabled>Préparer la reprise ↗</button></div>
<div id="notice" role="status" aria-live="polite"></div>
<details id="details"><summary id="details-label">À propos de la mesure</summary><p id="freshness"></p><footer id="privacy"></footer></details>
</main>
<script>
const $=id=>document.getElementById(id);
const texts={fr:{title:'Contexte',alert:'Alerte',waiting:'Mesure indisponible',unavailable:'Aucune mesure fiable — aucun pourcentage estimé.',prepare:'Préparer la reprise ↗',copied:'Demande copiée',failed:'Copie indisponible',safe:'Tu peux continuer tranquillement.',reached:'Seuil atteint · reprise au prochain point sûr.',details:'À propos de la mesure',privacy:'Lecture locale du chat choisi. Aucun envoi externe, aucune modification du chat. Le bouton copie une demande ; il ne crée pas de discussion.',fresh:'Dernière mesure native',poll:'Panneau actualisé toutes les 3 s',prompt:'Utilise $contexte-reprise-projet : prépare une synthèse vérifiée et applique le passage de relais configuré, au prochain point sûr, dans le même projet.',actions:{notify:'Avertissement',prepare:'Synthèse',compact:'Synthèse et compaction','new-chat':'Synthèse et nouveau chat','compact-and-new-chat':'Synthèse et relais'}},en:{title:'Context',alert:'Alert',waiting:'Measurement unavailable',unavailable:'No reliable measurement — no estimated percentage.',prepare:'Prepare handoff ↗',copied:'Request copied',failed:'Clipboard unavailable',safe:'You can keep going.',reached:'Threshold reached · handoff at the next safe point.',details:'About this measurement',privacy:'Local reading of the selected chat. No external requests or chat changes. The button copies a request; it does not create a chat.',fresh:'Latest native measurement',poll:'Panel refreshes every 3 s',prompt:'Use $contexte-reprise-projet: prepare a verified summary and follow the configured handoff at the next safe point, in the same project. Respond in English.',actions:{notify:'Notify',prepare:'Summary',compact:'Summary and compaction','new-chat':'Summary and new chat','compact-and-new-chat':'Summary and handoff'}}};
let lang='fr',chosen=false,last=null,copyStatus='';
function render(){const t=texts[lang];document.documentElement.lang=lang;document.title=t.title+' · Codex';$('title').textContent=t.title;['fr','en'].forEach(l=>$(l).setAttribute('aria-pressed',l===lang?'true':'false'));$('copy').textContent=t.prepare;$('details-label').textContent=t.details;$('privacy').textContent=t.privacy;$('meter').setAttribute('aria-label',t.title);if(!last||last.status!=='measured'){$('percent').textContent='—';$('tokens').textContent='—';$('hint').textContent=t.waiting;$('notice').textContent=t.unavailable;$('copy').disabled=true;$('fill').style.width='0';$('meter').removeAttribute('aria-valuenow');$('freshness').textContent='';return;}const m=last.measurement,s=last.settings,p=m.percent,reached=p>=s.threshold_percent;document.documentElement.style.setProperty('--tone',p>=Math.max(85,s.threshold_percent)?'#bf5a55':reached?'#b47a37':'#518865');$('percent').textContent=Math.floor(p)+(lang==='fr'?' %':'%');$('tokens').textContent=Math.round(m.tokens/1000)+'k / '+Math.round(m.window/1000)+'k';$('fill').style.width=Math.min(100,p)+'%';$('meter').setAttribute('aria-valuenow',Math.min(100,p));$('mark').style.left=s.threshold_percent+'%';$('threshold').textContent=t.alert+' '+s.threshold_percent+(lang==='fr'?' %':'%');$('hint').textContent=last.source_label?((last.historical?(lang==='fr'?'Historique · ':'History · '):'')+last.source_label):t.actions[s.action];$('hint').title=$('hint').textContent;$('copy').hidden=!!last.historical;$('copy').disabled=false;$('notice').textContent=copyStatus?t[copyStatus]:(reached?t.reached:t.safe);$('freshness').textContent=t.fresh+': '+(m.timestamp?new Date(m.timestamp).toLocaleString(lang==='fr'?'fr-FR':'en-GB'):'—')+' · '+t.poll;}
async function refresh(){try{last=await(await fetch('/api/status',{cache:'no-store'})).json();if(!chosen&&last.settings)lang=last.settings.language||'fr';}catch(e){last=null;}render();}
['fr','en'].forEach(l=>$(l).onclick=()=>{lang=l;chosen=true;render();});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(texts[lang].prompt);copyStatus='copied';}catch(e){copyStatus='failed';}render();setTimeout(()=>{copyStatus='';render();},4000);};
refresh();setInterval(refresh,3000);
</script>
</html>
